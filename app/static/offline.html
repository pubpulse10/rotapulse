<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>RotaPulse — offline</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="content">
    <div class="panel">
      <h1>You're offline</h1>
      <p class="hint">
        RotaPulse needs a live connection — rota changes and clock-in/out
        are saved straight to the server, so nothing here would be safe to
        rely on without one. Reconnect and try again.
      </p>
      <button type="button" class="btn-primary" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
