{% extends "base.html" %}
{% block title %}Birthdays — RotaPulse{% endblock %}
{% block content %}
<div class="panel">
  <h1>Birthdays &amp; anniversaries</h1>
  {% if not upcoming %}<p class="hint">No dates of birth on file yet.</p>{% endif %}
  {% for u in upcoming %}
    <div class="day-list-item">{{ u['name'] }} — in {{ u['days_until'] }} day(s)</div>
  {% endfor %}
</div>
{% endblock %}
