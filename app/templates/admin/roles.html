{% extends "base.html" %}
{% block title %}Roles — RotaPulse{% endblock %}
{% block content %}
<p><a class="btn-secondary" href="{{ url_for('admin_config.settings') }}">&laquo; Venue settings</a></p>
<div class="panel">
  <h1>Roles</h1>
  <table>
    {% for role in roles %}
      <tr>
        <td>
          <form method="post" action="{{ url_for('admin_config.rename_role', role_id=role['id']) }}" style="display:flex; gap:6px;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="name" value="{{ role['name'] }}">
            <button type="submit" class="btn-secondary">Rename</button>
          </form>
        </td>
        <td>
          <form method="post" action="{{ url_for('admin_config.delete_role', role_id=role['id']) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="link-button">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </table>

  <h2>Add a role</h2>
  <form method="post" action="{{ url_for('admin_config.create_role') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="name" placeholder="e.g. Bar staff" required>
    <button type="submit" class="btn-primary">Add role</button>
  </form>
</div>
{% endblock %}
