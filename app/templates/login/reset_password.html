{% extends "base.html" %}
{% block title %}Reset password — RotaPulse{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Choose a new password</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8">
    <button type="submit" class="btn-primary">Set password</button>
  </form>
</div>
{% endblock %}
