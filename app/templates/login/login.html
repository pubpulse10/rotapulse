{% extends "base.html" %}
{% block title %}Log in — RotaPulse{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Log in to {{ venue['name'] }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="identifier">Email or mobile</label>
    <input type="text" id="identifier" name="identifier" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn-primary">Log in</button>
  </form>
  <p><a href="{{ url_for('rota_login.forgot_password') }}">Forgot your password?</a></p>
</div>
{% endblock %}
